/* =========================================
   1. 沉浸式背景：动态流体流光
   ========================================= */
body {
  margin: 0; padding: 0;
  background-color: #020408 !important;
}

#mimo-wrapper {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
  overflow: hidden;
  background: #020408;
}

/* 2. 创建多个不规则的流体光斑 */
.tide-glow {
  position: absolute;
  width: 80vw;
  height: 80vh;
  filter: blur(80px);
  border-radius: 50%;
  opacity: 0.4;
  z-index: -1;
  mix-blend-mode: screen; /* 让颜色叠加时更透亮 */
}

/* 光斑 A：深海蓝 */
.glow-1 {
  background: radial-gradient(circle, #005bc5 0%, transparent 70%);
  top: -10%; left: -10%;
  animation: tideMove1 20s ease-in-out infinite alternate;
}

/* 光斑 B：极光绿 */
.glow-2 {
  background: radial-gradient(circle, #00f2fe 0%, transparent 70%);
  bottom: -20%; right: -10%;
  animation: tideMove2 25s ease-in-out infinite alternate-reverse;
}

/* 光斑 C：赛博紫 */
.glow-3 {
  background: radial-gradient(circle, #4facfe 0%, transparent 70%);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  animation: tideMove3 30s linear infinite;
}

/* 3. 科技线条遮罩：让流动透过“缝隙”显现 */
#mimo-wrapper::after {
  content: "";
  position: absolute;
  inset: 0;
  /* 绘制不规则的细密网格，增加电子感 */
  background-image: 
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 30px 30px;
  /* 渐变遮罩：中心清晰，边缘消失 */
  mask-image: radial-gradient(circle at center, black 30%, transparent 90%);
  -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 90%);
  pointer-events: none;
}

/* 4. 流体轨迹动画 */
@keyframes tideMove1 {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(30vw, 20vh) scale(1.2); }
}

@keyframes tideMove2 {
  0% { transform: translate(0, 0) rotate(0deg); }
  100% { transform: translate(-40vw, -30vh) rotate(90deg); }
}

@keyframes tideMove3 {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 0.2; }
  50% { transform: translate(-30%, -60%) scale(1.5); opacity: 0.5; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0.2; }
}

/* 5. 玻璃容器优化：极致透明 */
#mimo-glass-container {
  width: 92vw;

  border: 1px solid rgba(255, 255, 255, 0.08);

  box-shadow: 0 40px 120px rgba(0, 0, 0, 0.8);
}

<script>
  const chatContent = document.getElementById('chat-content');
  const aiInput = document.getElementById('ai-input');
  const aiSend = document.getElementById('ai-send');
  
  // 请务必更换为你成功的 Worker 地址
  const PROXY_URL = 'https://mimo-api.lhy1207.workers.dev'; 

  function appendMsg(text, role) {
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper ' + role;
    wrapper.innerHTML = `
      <div class="avatar">${role === 'ai' ? 'M' : 'U'}</div>
      <div class="chat-msg">${text}</div>
    `;
    chatContent.appendChild(wrapper);
    chatContent.scrollTop = chatContent.scrollHeight;
    return wrapper;
  }

  async function handleSend() {
    const text = aiInput.value.trim();
    if(!text) return;
    
    appendMsg(text, 'user');
    aiInput.value = '';
    
    const loadingWrapper = appendMsg('潮汐正在思考...', 'ai');
    const msgDiv = loadingWrapper.querySelector('.chat-msg');

    try {
      const response = await fetch(PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [{ role: 'user', content: text }] })
      });

      if (!response.ok) throw new Error('Network error');
      
      const data = await response.json();
      const content = data.choices[0].message.content;
      
      // 执行打字机效果
      msgDiv.innerText = '';
      let index = 0;
      const interval = setInterval(() => {
        if (index < content.length) {
          msgDiv.innerText += content.charAt(index);
          index++;
          chatContent.scrollTop = chatContent.scrollHeight;
        } else {
          clearInterval(interval);
        }
      }, 20);

    } catch (error) {
      msgDiv.innerText = '暂无法连接到智慧大脑，请稍后再试。';
    }
  }

  aiSend.onclick = handleSend;
  aiInput.onkeydown = (e) => { if(e.key === 'Enter') handleSend(); };
</script>
